[package]
name = "ms-dlp"
version = "0.1.0"
edition = "2021"
authors = ["LunaFleuret <LunaFleuret@users.noreply.github.com>"]
description = "High-performance Universal Music Downloader with EBU R128 loudness normalization and robust thumbnail recovery"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
url = "2.5"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
